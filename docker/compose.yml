name: docker
services:
  mysql-kuayrai:
    image: mysql:8.4
    container_name: mysql-kuayrai
    restart: unless-stopped
    ports: ["127.0.0.1:3308:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: keeled
      MYSQL_USER: keelek
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      TZ: Asia/Bangkok
    volumes:
      - kuayrai-data:/var/lib/mysql
      - ../schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10
volumes:
  kuayrai-data:
